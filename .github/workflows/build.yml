name: Build DUA LUPA Clicker
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: DuaLupaClicker
          path: target/DuaLupaClicker.jar
